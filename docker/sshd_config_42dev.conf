# 42-dev-env 컨테이너 sshd 설정 (base 이미지에 구움).
# ⭐ 접속 모델: 개발자는 호스트가 아니라 '컨테이너 sshd'로 직접 들어온다.
#    호스트 docker 접근 없이도 작업 가능 → 호스트 daemon 오염 경로가 사라진다.
#    VS Code 는 Remote-SSH 로 이 포트(컨테이너 sshd)를 원격 호스트처럼 붙는다.

Port 22
PermitRootLogin no
PasswordAuthentication no
PubkeyAuthentication yes
ChallengeResponseAuthentication no
X11Forwarding no
PrintMotd no
# VS Code Remote-SSH / 포트포워딩에 필요
AllowTcpForwarding yes
AllowAgentForwarding yes
ClientAliveInterval 60
ClientAliveCountMax 3
AcceptEnv LANG LC_*
