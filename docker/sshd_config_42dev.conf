# 42-dev-env 컨테이너 sshd 설정 (base 이미지에 구움).
# ⭐ 접속 모델: 개발자는 호스트가 아니라 '컨테이너 sshd'로 직접 들어온다.
#    호스트 docker 접근 없이도 작업 가능 → 호스트 daemon 오염 경로가 사라진다.
#    VS Code 는 Remote-SSH 로 이 포트(컨테이너 sshd)를 원격 호스트처럼 붙는다.

# ⭐ 호스트 키는 이미지가 아니라 provision 이 호스트에 '최초 1회' 발급해 여기로 마운트한다
#    (/etc/ssh/keys, read-only). → 이미지 재빌드·컨테이너 재발급에도 호스트 키(신원)가 불변.
#    마운트가 없으면 sshd 는 이 키들을 못 찾아 기동에 실패한다(의도된 loud fail — 예전처럼
#    ephemeral 키를 조용히 만들어 known_hosts 를 깨뜨리지 않는다).
HostKey /etc/ssh/keys/ssh_host_ed25519_key
HostKey /etc/ssh/keys/ssh_host_rsa_key
HostKey /etc/ssh/keys/ssh_host_ecdsa_key

Port 22
PermitRootLogin no
PasswordAuthentication no
PubkeyAuthentication yes
ChallengeResponseAuthentication no
X11Forwarding no
PrintMotd no
# VS Code Remote-SSH / 포트포워딩에 필요
AllowTcpForwarding yes
AllowAgentForwarding yes
ClientAliveInterval 60
ClientAliveCountMax 3
AcceptEnv LANG LC_*
