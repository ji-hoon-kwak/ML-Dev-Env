# 플랫폼(BE/FE) 개발 환경 — GPU/torch 없음.
# Gateway(FastAPI) + FE(Next.js) 개발용. 실제 서비스 의존성은 repo 에서
# `pip install -e .`(light — torch 없음) / `npm install` 로 각자 받는다.
name: dev
channels:
  - conda-forge
dependencies:
  - python=3.12
  - nodejs           # Next.js FE (AI 이미지엔 없던 것)
  - pip
  - git
  - pip:
      - fastapi
      - "uvicorn[standard]"
      - httpx
