[project]
name = "pia-ai-dev-env"
version = "0.1.0"
description = "42 dev container shared Python environment"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "opencv-python",
    "ultralytics",
    "numpy",
    "pandas",
]

# torch/torchvision 은 PyPI 기본 wheel 이 CPU 빌드라서
# CUDA wheel 인덱스를 명시한다. 서버 CUDA 버전에 맞게 cu124 부분 조정.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
