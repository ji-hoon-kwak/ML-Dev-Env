# 기본 dev 환경. 개발자는 이걸 그대로 쓰거나 conda create 로 자기 env 를 추가.
name: dev
channels:
  - conda-forge
dependencies:
  # node/npm 은 conda 가 아니라 시스템(/usr/bin)에 설치한다(Dockerfile.ml-base NodeSource)
  # — conda env 활성화와 무관하게 기본 PATH 에서 잡히도록. (conda 안에 두면 dev env
  #   활성 때만 잡혀 팀원이 "node 없음"을 겪는다.)
  - python=3.12
  - numpy
  - pandas
  - pip
  - pip:
      # torch CUDA 빌드 명시 (서버 CUDA 12.4 기준 — 드라이버에 맞게 조정)
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch
      - torchvision
      - opencv-python
      - ultralytics
